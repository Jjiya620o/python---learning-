<!DOCTYPE html>
<html>
<head>
    <title>My Website ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, pink, hotpink);
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 40px 25px;
            border-radius: 25px;
            width: 80%;
        }

        h1 {
            color: white;
            font-size: 38px;
        }

        p {
            color: white;
            font-size: 20px;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: white;
            color: hotpink;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Hello ❤️</h1>

        <p>Welcome to my little website ✨</p>

        <button>START 💖</button>

    </div>

</body>
</html>
