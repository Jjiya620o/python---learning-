<!DOCTYPE html>
<html>
<head>

    <title>My Website ❤️</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, pink, hotpink);
        }

        .box {
            background: rgba(255,255,255,0.2);
            padding: 40px 25px;
            border-radius: 25px;
            width: 80%;
        }

        h1 {
            color: white;
            font-size: 36px;
        }

        p {
            color: white;
            font-size: 20px;
        }

        button {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            background: white;
            color: hotpink;
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }

        #second, #third {
            display: none;
        }

        .photo {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 0 25px white;
    animation: photoZoom 2s infinite alternate;
}

@keyframes photoZoom {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.08);
    }
}

    </style>

</head>

<body>

    <!-- FIRST SCREEN -->

    <div class="box" id="first">

        <h1>Hello ❤️</h1>

        <p>Welcome to my little website ✨</p>

        <button onclick="start()">START 💖</button>

    </div>


    <!-- SECOND SCREEN -->

    <div class="box" id="second">

        <h1>Yay! 🎉</h1>

        <p>Welcome to the next screen ✨</p>

        <button onclick="next()">NEXT 💕</button>

    </div>


    <!-- THIRD SCREEN -->

    <div class="box" id="third">

        <h1>Beautiful Memories ✨</h1>

        <img class="photo" src="Snapchat-777984449.jpg">

        <p>Every picture tells a little story ❤️</p>

        <button onclick="again()">NEXT 🌸</button>

    </div>


    <script>

        function start() {

            document.getElementById("first").style.display = "none";

            document.getElementById("second").style.display = "block";

        }


        function next() {

            document.getElementById("second").style.display = "none";

            document.getElementById("third").style.display = "block";

        }


        function again() {

            alert("More surprises coming soon! ✨");

        }

    </script>

</body>
</html>
