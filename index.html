<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Favourite Person ❤️</title>

<!-- Beautiful Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #8e3d68, transparent 35%),
        radial-gradient(circle at bottom right, #4d315f, transparent 35%),
        linear-gradient(135deg, #160d20, #281329, #130b1b);

    color: white;
    overflow-x: hidden;
    font-family: "Cormorant Garamond", serif;
}

/* Floating Hearts */

.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: floatHeart linear infinite;
    opacity: 0.7;
    z-index: 0;
}

@keyframes floatHeart {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Sparkles */

.sparkle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    animation: sparkleAnim 2s infinite alternate;
    opacity: 0.6;
}

@keyframes sparkleAnim {

    from {
        transform: scale(0.5);
        opacity: 0.2;
    }

    to {
        transform: scale(1.5);
        opacity: 1;
    }
}

/* Screens */

.screen {
    min-height: 100vh;
    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    text-align: center;

    position: relative;
    z-index: 2;
}

.active {
    display: flex;
}

/* Main Box */

.box {
    width: min(92%, 600px);

    padding: 40px 25px;

    border-radius: 30px;

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(14px);

    border: 1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.4),
        inset 0 0 30px rgba(255,255,255,0.03);
}

/* Headings */

h1 {
    font-family: "Playfair Display", serif;

    font-size: clamp(30px, 7vw, 52px);

    margin-bottom: 18px;
}

.subtitle {
    font-size: 20px;

    opacity: 0.9;

    margin-bottom: 30px;
}

/* Buttons */

button {
    border: none;

    padding: 14px 30px;

    border-radius: 30px;

    background: linear-gradient(
        135deg,
        #ff7eb3,
        #ff4f91
    );

    color: white;

    font-family: "Playfair Display", serif;

    font-size: 17px;

    cursor: pointer;

    box-shadow: 0 8px 25px rgba(255,80,150,0.35);

    transition: 0.3s;
}

button:hover {
    transform: translateY(-3px) scale(1.03);
}

/* Photo Screen */

.photo-title {
    font-family: "Dancing Script", cursive;

    font-size: 38px;

    margin-bottom: 20px;
}

/* Polaroid */

.photo-box {
    display: inline-block;

    background: white;

    padding: 12px 12px 25px;

    border-radius: 5px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.5),
        0 0 30px rgba(255,180,220,0.25);

    transform: rotate(-2deg);

    margin-bottom: 20px;

    animation: polaroidFloat 3s ease-in-out infinite;
}

@keyframes polaroidFloat {

    0%,100% {
        transform: rotate(-2deg) translateY(0);
    }

    50% {
        transform: rotate(2deg) translateY(-8px);
    }
}

.photo-box img {
    width: min(75vw, 330px);

    height: min(75vw, 330px);

    object-fit: cover;

    display: block;

    border-radius: 3px;

    animation: photoAppear 0.8s ease;
}

@keyframes photoAppear {

    from {
        opacity: 0;
        transform: scale(0.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.photo-number {
    font-family: "Playfair Display", serif;

    font-size: 14px;

    letter-spacing: 2px;

    opacity: 0.75;

    margin-bottom: 8px;
}

.photo-caption {
    font-family: "Dancing Script", cursive;

    font-size: 25px;

    color: #ffd6e8;

    margin-bottom: 20px;
}

/* Message */

.message-title {
    font-family: "Dancing Script", cursive;

    font-size: 40px;

    margin-bottom: 25px;

    color: #ffd6e8;
}

.message {
    font-family: "Dancing Script", cursive;

    font-size: clamp(24px, 6vw, 34px);

    line-height: 1.55;

    min-height: 170px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;
}

.message.fade {
    animation: messageFade 0.7s ease;
}

@keyframes messageFade {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Final Screen */

.final-title {
    font-family: "Dancing Script", cursive;

    font-size: clamp(45px, 11vw, 75px);

    color: #ffd1e4;

    margin-bottom: 20px;

    animation: finalGlow 2s infinite alternate;
}

@keyframes finalGlow {

    from {
        text-shadow: 0 0 8px rgba(255,150,200,0.3);
    }

    to {
        text-shadow:
            0 0 15px rgba(255,150,200,0.8),
            0 0 30px rgba(255,100,180,0.5);
    }
}

.final-message {
    font-family: "Dancing Script", cursive;

    font-size: 30px;

    line-height: 1.5;

    margin-bottom: 25px;
}

/* Mobile */

@media (max-width: 500px) {

    .box {
        padding: 30px 18px;
    }

    .photo-box img {
        width: 270px;
        height: 270px;
    }

    .message {
        font-size: 25px;
        min-height: 200px;
    }

    .photo-title {
        font-size: 34px;
    }

}

</style>
</head>


<body>


<!-- Floating Decorations -->

<div class="heart" style="left:8%; animation-duration:8s;">❤️</div>
<div class="heart" style="left:22%; animation-duration:11s;">💗</div>
<div class="heart" style="left:40%; animation-duration:9s;">💕</div>
<div class="heart" style="left:60%; animation-duration:12s;">❤️</div>
<div class="heart" style="left:78%; animation-duration:10s;">💖</div>
<div class="heart" style="left:90%; animation-duration:13s;">💕</div>

<div class="sparkle" style="left:15%;top:20%;"></div>
<div class="sparkle" style="left:80%;top:25%;"></div>
<div class="sparkle" style="left:30%;top:70%;"></div>
<div class="sparkle" style="left:70%;top:65%;"></div>


<!-- ========================= -->
<!-- START SCREEN -->
<!-- ========================= -->

<section id="startScreen" class="screen active">

    <div class="box">

        <h1>For My Favourite Person ❤️</h1>

        <p class="subtitle">
            A little surprise is waiting for you...
        </p>

        <button onclick="startPhotos()">
            Open 💌
        </button>

    </div>

</section>



<!-- ========================= -->
<!-- PHOTO SCREEN -->
<!-- ========================= -->

<section id="photoScreen" class="screen">

    <div class="box">

        <div class="photo-title">
            Some Special Memories ❤️
        </div>

        <div class="photo-number" id="photoNumber">
            MEMORY 1 / 4
        </div>

        <div class="photo-box">

            <img
                id="photo"
                src="Screenshot_20261001_091751.jpg"
                alt="Special Memory"
            >

        </div>

        <div class="photo-caption" id="photoCaption">
            A little memory of you ❤️
        </div>

        <button id="photoButton" onclick="nextPhoto()">
            Continue ♡
        </button>

    </div>

</section>



<!-- ========================= -->
<!-- MESSAGE SCREEN -->
<!-- ========================= -->

<section id="messageScreen" class="screen">

    <div class="box">

        <div class="message-title">
            Something From My Heart ❤️
        </div>

        <div id="message" class="message"></div>

        <button id="messageButton" onclick="nextMessage()">
            Continue ♡
        </button>

    </div>

</section>



<!-- ========================= -->
<!-- FINAL SCREEN -->
<!-- ========================= -->

<section id="finalScreen" class="screen">

    <div class="box">

        <div class="final-title">
            HAPPY BIRTHDAY 🎂
        </div>

        <div class="final-message">

            DARLING ♥️ 🧿 😚 🫂

            <br><br>

            LOVE YOU ❤️ BBY 😚

            <br><br>

            🫂🫂🫂

        </div>

        <button onclick="showSurprise()">
            One Last Surprise 💖
        </button>

    </div>

</section>



<script>

/* =========================
   PHOTOS
========================= */

const photos = [

    "Screenshot_20261001_091751.jpg",

    "Snapchat-1783390479.jpg",

    "Snapchat-874578704.jpg",

    "Screenshot_20261001_092059.jpg"

];


const captions = [

    "A little memory of you ❤️",

    "One more beautiful memory 🥺",

    "Some moments are special ✨",

    "This one is close to my heart 🫂"

];


let currentPhoto = 0;


/* =========================
   START
========================= */

function startPhotos() {

    document.getElementById("startScreen")
        .classList.remove("active");

    document.getElementById("photoScreen")
        .classList.add("active");

    currentPhoto = 0;

    showPhoto();
}



/* =========================
   SHOW PHOTO
========================= */

function showPhoto() {

    const photo =
        document.getElementById("photo");

    photo.style.animation = "none";

    setTimeout(function() {

        photo.src = photos[currentPhoto];

        photo.style.animation =
            "photoAppear 0.8s ease";

    }, 50);


    document.getElementById("photoNumber")
        .innerText =
        "MEMORY " +
        (currentPhoto + 1) +
        " / 4";


    document.getElementById("photoCaption")
        .innerText =
        captions[currentPhoto];


    if (currentPhoto === 3) {

        document.getElementById("photoButton")
            .innerText =
            "Now read my heart ❤️";

    } else {

        document.getElementById("photoButton")
            .innerText =
            "Continue ♡";

    }

}



/* =========================
   NEXT PHOTO
========================= */

function nextPhoto() {

    if (currentPhoto < 3) {

        currentPhoto++;

        showPhoto();

    } else {

        document.getElementById("photoScreen")
            .classList.remove("active");

        document.getElementById("messageScreen")
            .classList.add("active");

        currentMessage = 0;

        showMessage();

    }

}



/* =========================
   YOUR MESSAGE
========================= */

const messages = [

`Hey my all time favourite one 🥺🫂🧿`,

`You are very special in my life ❤️ 🤌🏼`,

`I know hm daily nhi milte daily bat nhi krte but I miss you always 🥹 teri jagah koi nhi le skta`,

`Or jyda kuch nhi bolna chahti hu bs tu hmesha mere sath rhna 🤌🏼 or hmesha sath dena .....`,

`Or sorry yrr 😔 mai tere bure vkt pr tere sath nhi thi us. Vakt mujhe tere sath hona tha 😔 yah bat mujhe hamesha regret feel krati  hai ...`,

`I am very sorry ....`,

`HAPPY BIRTHDAY 🎂 DARLING ♥️ 🧿 😚 🫂 LOVE YOU ❤️ BBY 😚`,

`Mai hmesha tere sath rhungi tere hr bure vakt pe tera sath dungi  🫂🫂🫂`

];


let currentMessage = 0;



/* =========================
   SHOW MESSAGE
========================= */

function showMessage() {

    const message =
        document.getElementById("message");


    message.classList.remove("fade");


    setTimeout(function() {

        message.innerText =
            messages[currentMessage];

        message.classList.add("fade");

    }, 50);


    const button =
        document.getElementById("messageButton");


    if (currentMessage === messages.length - 1) {

        button.innerText =
            "Finish ❤️";

    } else {

        button.innerText =
            "Continue ♡";

    }

}



/* =========================
   NEXT MESSAGE
========================= */

function nextMessage() {

    if (currentMessage < messages.length - 1) {

        currentMessage++;

        showMessage();

    } else {

        document.getElementById("messageScreen")
            .classList.remove("active");

        document.getElementById("finalScreen")
            .classList.add("active");

    }

}



/* =========================
   FINAL SURPRISE
========================= */

function showSurprise() {

    alert(
        "No matter what happens, always keep smiling ❤️🧿🫂"
    );

}

</script>

</body>
   </html>
